services:
  olx-parser:
    build:
      context: .
      dockerfile: Dockerfile
    image: olx-parser:test
    environment:
      DOTNET_RUNNING_IN_CONTAINER: "true"
      SELENIUM_REMOTE_URL: http://selenium:4444
    depends_on:
      selenium:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  selenium:
    image: selenium/standalone-chromium:latest
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:4444/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
